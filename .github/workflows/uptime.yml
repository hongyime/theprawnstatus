name: uptime

# Generated status data is written to the configured status store, not `main`.
# `STATUS_STORAGE=git` writes the orphan `data` branch; `supabase` writes the
# Supabase status tables. The guard-data-branch workflow still blocks accidental
# generated-data merges into `main`.
on:
  schedule:
    - cron: '2-59/5 * * * *'
    - cron: '20 0 * * *'
  workflow_dispatch:
    inputs:
      job:
        description: Job to run
        required: true
        default: uptime
        type: choice
        options:
          - uptime
          - rebuild

concurrency:
  group: status-storage
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  uptime:
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'uptime' || github.event_name == 'schedule' && github.event.schedule == '2-59/5 * * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:uptime
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_STORAGE: ${{ vars.STATUS_STORAGE }}
          STATUS_RUNNER: ${{ vars.STATUS_RUNNER }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  rebuild:
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'rebuild' || github.event_name == 'schedule' && github.event.schedule == '20 0 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run rebuild:summary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_STORAGE: ${{ vars.STATUS_STORAGE }}
          STATUS_RUNNER: ${{ vars.STATUS_RUNNER }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
