name: uptime

# Generated status data is committed to the orphan `data` branch, not `main`.
# Keep `main` for source/config only; the guard-data-branch workflow blocks
# accidental merges that bring `summary.json`, `health.json`, or `history/`
# into `main`.
on:
  schedule:
    - cron: '3,18,33,48 * * * *'
    - cron: '20 0 * * *'
  workflow_dispatch:
    inputs:
      job:
        description: Job to run
        required: true
        default: uptime
        type: choice
        options:
          - uptime
          - rebuild

concurrency:
  group: data-branch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  uptime:
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'uptime' || github.event_name == 'schedule' && github.event.schedule == '3,18,33,48 * * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:uptime
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rebuild:
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'rebuild' || github.event_name == 'schedule' && github.event.schedule == '20 0 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run rebuild:summary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
