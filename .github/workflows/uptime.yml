name: uptime

on:
  schedule:
    - cron: '3,18,33,48 * * * *'
    - cron: '20 0 * * *'
  workflow_dispatch:
    inputs:
      job:
        description: Job to run
        required: true
        default: uptime
        type: choice
        options:
          - uptime
          - rebuild

concurrency:
  group: data-branch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  uptime:
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'uptime' || github.event_name == 'schedule' && github.event.schedule == '3,18,33,48 * * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:uptime
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rebuild:
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'rebuild' || github.event_name == 'schedule' && github.event.schedule == '20 0 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run rebuild:summary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
