name: Build Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: status-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_OPTIONS: --max-old-space-size=2048
      # Build and browser checks use generated data and cannot contact providers.
      STATUS_OFFLINE_BUILD: '1'
      VITE_SUPABASE_URL: https://status-fixture.invalid
      VITE_SUPABASE_PUBLISHABLE_KEY: fixture-key
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: status-browser-failure
          path: test-results/
          retention-days: 3

  collector-contracts:
    name: Collector storage and HTTP contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_PASSWORD: synthetic-status-fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic-status-fixture
      STATUS_TEST_ARTIFACT_DIR: ${{ runner.temp }}/status-contracts
      STATUS_TEST_POSTGREST: ${{ runner.temp }}/status-tools/postgrest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.6
      - run: npm ci
      - name: Install the pinned PostgREST fixture runtime
        run: |
          mkdir -p "$RUNNER_TEMP/status-tools"
          curl --fail --location --retry 2 --max-time 90 https://github.com/PostgREST/postgrest/releases/download/v14.5/postgrest-v14.5-linux-static-x86-64.tar.xz -o "$RUNNER_TEMP/status-tools/postgrest.tar.xz"
          echo "ab5cc7e974d4940447991804588cfb8b3f7b2c57b691f0905df04d51ede69470  $RUNNER_TEMP/status-tools/postgrest.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/status-tools/postgrest.tar.xz" -C "$RUNNER_TEMP/status-tools"
      - run: deno check --no-config supabase/functions/status-uptime-collector/index.ts
      - run: python3 tests/collector/run.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: collector-contract-results
          path: ${{ runner.temp }}/status-contracts/
          retention-days: 3
